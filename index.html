<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080709">
  <meta name="description" content="GM MITOS · Elige tu mundo: Aebraeth, fantasía épica, o Star City, universo Cyberpunk RED.">
  <meta property="og:title" content="GM MITOS · Elige tu mundo">
  <meta property="og:description" content="Dos mundos. Una historia que comienza con tu elección.">
  <title>GM MITOS · Elige tu mundo</title>
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme:dark; --gm-burgundy:#780606; --gm-gold:#EABE3F; --gm-black:#070709; --white:#f6f2e9; --serif:"Cormorant Garamond",Georgia,serif; --tech:"Chakra Petch",Arial,sans-serif; --sans:"Manrope",system-ui,sans-serif; }
    *,*::before,*::after{box-sizing:border-box}
    html{height:100%;scroll-behavior:smooth}
    body{margin:0;min-width:320px;min-height:100%;overflow:hidden;background:var(--gm-black);color:var(--white);font-family:var(--sans);-webkit-font-smoothing:antialiased}
    .portal{position:relative;height:100vh;height:100svh;isolation:isolate;overflow:hidden}
    .worlds{display:flex;width:100%;height:100%}
    .world{position:relative;display:block;min-width:0;flex:1;isolation:isolate;padding:0;border:0;margin:0;color:inherit;background:var(--gm-black);text-align:left;cursor:pointer;overflow:hidden;transition:flex 850ms cubic-bezier(.22,.7,.19,1)}
    .world::before{content:"";position:absolute;z-index:-2;inset:-3%;background-position:center;background-size:cover;filter:saturate(.98);transform:scale(1.015);transition:transform 1100ms cubic-bezier(.2,.75,.2,1),filter 700ms}
    .world::after{content:"";position:absolute;z-index:-1;inset:0;background:linear-gradient(180deg,#08050b90 0%,#06070b15 25%,#06070b00 48%,#06050a58 67%,#030308e8 100%)}
    .world-aebraeth::before{background-image:url("./assets/aebraeth-portal.webp");background-position:53% center}
    .world-starcity::before{background-image:url("./assets/starcity-portal.webp");background-position:52% center}
    .world-aebraeth{border-right:1px solid #eabe3f38}
    .world:hover,.world:focus-visible,.world[aria-pressed="true"]{flex:1.12}
    .world:hover::before,.world:focus-visible::before,.world[aria-pressed="true"]::before{transform:scale(1.075);filter:saturate(1.13)}
    .world:focus-visible{outline:3px solid var(--gm-gold);outline-offset:-5px}
    .world-content{position:absolute;inset:auto 0 0 0;padding:clamp(24px,4.5vw,78px) clamp(23px,5vw,100px) clamp(45px,6vh,88px);text-shadow:0 3px 22px #000c;transform:translateY(0);transition:transform .6s}
    .world:hover .world-content{transform:translateY(-9px)}
    .world-genre{font:700 .69rem/1.4 var(--sans);letter-spacing:.26em;color:var(--gm-gold);text-transform:uppercase}
    .world-starcity .world-genre{color:#99e9ff}
    .world h2{margin:16px 0 6px;font:600 clamp(3.55rem,7.3vw,8rem)/.84 var(--serif);letter-spacing:-.045em;color:#f5e7cc}
    .world-starcity h2{font-family:var(--tech);font-size:clamp(2.6rem,5.3vw,6rem);line-height:1.02;letter-spacing:-.035em;font-weight:600;color:#e8faff;text-shadow:0 3px 24px #051018,0 0 26px #7de8ff38}
    .world-desc{display:block;margin:18px 0 25px;font-size:clamp(.85rem,1.05vw,1.05rem);line-height:1.7;max-width:390px;color:#eff0efe0;font-weight:500}
    .world-enter{display:inline-flex;align-items:center;gap:14px;padding-bottom:9px;border-bottom:1px solid var(--gm-gold);font:700 .75rem var(--sans);text-transform:uppercase;letter-spacing:.16em;color:#fff}
    .world-starcity .world-enter{border-color:#8ce4ff}
    .world-enter svg{width:18px;height:18px;transition:transform .35s}
    .world:hover .world-enter svg{transform:translate(5px,-4px)}
    .brand{position:absolute;z-index:5;top:clamp(15px,2.6vw,36px);left:50%;transform:translateX(-50%);pointer-events:none;text-align:center;width:min(870px,calc(100% - 30px));text-shadow:0 4px 22px #000b}
    .brand-logo{display:inline-block;position:relative;font:600 clamp(1.35rem,2.25vw,2.45rem)/1 var(--serif);letter-spacing:.16em;color:var(--gm-gold)}
    .brand-logo::before,.brand-logo::after{content:"";display:inline-block;vertical-align:middle;height:1px;width:clamp(18px,4vw,73px);margin:0 clamp(8px,2vw,26px);background:linear-gradient(90deg,transparent,var(--gm-gold))}
    .brand-logo::after{transform:scaleX(-1)}
    .brand-sub{font:600 clamp(.67rem,1vw,.87rem)/1.4 var(--sans);letter-spacing:.35em;margin-top:15px;color:#f3ede1}
    .brand-rule{width:62px;height:3px;margin:13px auto 0;background:var(--gm-burgundy);box-shadow:0 0 0 1px #eabe3f88}
    .divider{position:absolute;z-index:4;left:50%;top:19%;height:58%;transform:translateX(-50%);width:1px;background:linear-gradient(180deg,transparent,#eabe3f3c 15%,#eabe3f91 50%,#eabe3f3c 85%,transparent);pointer-events:none}
    .selection{position:absolute;z-index:5;left:50%;bottom:13px;transform:translateX(-50%);font-size:.6rem;font-weight:700;letter-spacing:.14em;color:#fff8;background:rgba(11,7,9,.38);padding:5px 11px;border-radius:12px;pointer-events:none;white-space:nowrap}
    .selection[data-active]{color:var(--gm-gold);background:#0a0809b8}
    @media(max-width:760px){
      body{overflow:hidden}
      .worlds{flex-direction:column}
      .world{flex:1;min-height:0;width:100%}
      .world-aebraeth{border-right:0;border-bottom:1px solid #eabe3f58}
      .world:hover,.world:focus-visible,.world[aria-pressed="true"]{flex:1.02}
      .world::before{inset:-1%}
      .world-aebraeth::before{background-position:50% 46%}
      .world-starcity::before{background-position:52% 43%}
      .brand{top:12px;width:calc(100% - 16px)}
      .brand-logo{font-size:1.5rem}
      .brand-logo::before,.brand-logo::after{width:21px;margin:0 8px}
      .brand-sub{font-size:.6rem;letter-spacing:.19em;margin-top:5px}
      .brand-rule{width:38px;height:2px;margin:5px auto}
      .world-content{padding:10px 23px 29px}
      .world:first-child .world-content{padding-bottom:20px}
      .world h2{font-size:clamp(3.35rem,12vw,5.2rem);margin:6px 0 0}
      .world-starcity h2{font-size:clamp(2.35rem,9.3vw,4.4rem)}
      .world-genre{font-size:.52rem;letter-spacing:.17em}
      .world-desc{font-size:.69rem;line-height:1.35;margin:7px 0 11px;max-width:360px}
      .world-enter{font-size:.6rem;letter-spacing:.12em;padding-bottom:4px;gap:6px}
      .world-enter svg{width:14px;height:14px}
      .divider{display:none}
      .selection{bottom:calc(50% - 14px);font-size:.48rem;background:#08080ad8;border:1px solid #eabe3f60}
    }
    @media(max-width:370px) and (max-height:730px){
      .world-desc{display:none}
      .world-content{padding-bottom:20px}
    }
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
  </style>
</head>
<body>
  <main class="portal" aria-label="Elige tu mundo">
    <div class="worlds">
      <button type="button" class="world world-aebraeth" data-world="aebraeth" aria-pressed="false" aria-label="Elegir Aebraeth">
        <span class="world-content">
          <span class="world-genre">I · Alta fantasía</span>
          <h2>Aebraeth</h2>
          <span class="world-desc">Bosques ancestrales, reinos, océanos y leyendas que cobran vida.</span>
          <span class="world-enter">Elegir Aebraeth <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M5 19 19 5M7 5h12v12"/></svg></span>
        </span>
      </button>
      <button type="button" class="world world-starcity" data-world="starcity" aria-pressed="false" aria-label="Elegir Star City">
        <span class="world-content">
          <span class="world-genre">II · Cyberpunk RED · 2080+</span>
          <h2>Star City</h2>
          <span class="world-desc">Cien millones de vidas. Seis regiones. Poder corporativo y neón.</span>
          <span class="world-enter">Elegir Star City <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M5 19 19 5M7 5h12v12"/></svg></span>
        </span>
      </button>
    </div>
    <div class="brand" aria-label="GM Mitos - Elige tu mundo">
      <div class="brand-logo">GM MITOS</div>
      <div class="brand-rule"></div>
      <div class="brand-sub">ELIGE TU MUNDO</div>
    </div>
    <span class="divider" aria-hidden="true"></span>
    <div class="selection" id="selection">DOS UNIVERSOS · UNA ELECCIÓN</div>
  </main>
  <script>
    const buttons=[...document.querySelectorAll('.world')];
    const note=document.getElementById('selection');
    function selectWorld(name,updateHash=true){
      for(const button of buttons) button.setAttribute('aria-pressed',String(button.dataset.world===name));
      const world=name==='aebraeth'?'AEBRAETH':'STAR CITY';
      note.textContent=world+' SELECCIONADO';note.dataset.active='';
      if(updateHash) history.replaceState(null,'','#'+name);
    }
    buttons.forEach(button=>button.addEventListener('click',()=>selectWorld(button.dataset.world)));
    const initial=location.hash.slice(1);
    if(['aebraeth','starcity'].includes(initial)) selectWorld(initial,false);
  </script>
</body>
</html>
